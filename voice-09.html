<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fce4ec"><title>پیام ایمان برای مامان</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#fff0f5 0%,#fce4ec 48%,#fff8ee 100%);font-family:Tahoma,Arial,sans-serif;color:#563747}.wrap{width:100%;max-width:470px}.card{position:relative;overflow:hidden;text-align:center;padding:34px 25px 28px;background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.95);border-radius:30px;box-shadow:0 18px 55px rgba(168,87,117,.18),0 3px 12px rgba(168,87,117,.08)}.flowers{font-size:30px;letter-spacing:7px;margin-bottom:12px}.eyebrow{display:inline-block;padding:7px 15px;border-radius:30px;background:#fff0f5;color:#bd557c;font-size:13px;font-weight:bold;margin-bottom:13px}h1{margin:0 0 10px;font-size:clamp(22px,6vw,29px);line-height:1.65;color:#a94370;font-weight:800}.subtitle{margin:0 auto 24px;font-size:16px;line-height:2;color:#785568}.play{width:100%;border:0;border-radius:18px;padding:16px 18px;background:linear-gradient(135deg,#e96f9d,#cc4f83);color:white;font-family:inherit;font-size:18px;font-weight:bold;box-shadow:0 8px 18px rgba(204,79,131,.25);cursor:pointer}.play:active{transform:scale(.99)}audio{display:block;width:100%;margin:22px 0 10px;height:42px}.hint{font-size:13px;color:#927486;line-height:1.9;margin:12px 0 0}.signature{margin:22px 0 0;padding-top:18px;border-top:1px dashed #efc4d4;color:#b54e7b;font-size:17px;font-weight:bold}.heart{color:#e66b99}.bottom{margin-top:15px;font-size:12px;color:#ad91a0}@media(max-width:380px){.card{padding:28px 18px}.subtitle{font-size:15px}}
</style></head>
<body><div class="wrap"><main class="card"><div class="flowers">🌷 💝 🌷</div><div class="eyebrow">یک هدیه کوچک از طرف من</div><h1>یک پیام قشنگ برای مامان عزیزم ⚘</h1><p class="subtitle">یک هدیه صوتی پر از عشق<br>مامان جونم، برای شنیدن پیامم دکمه پخش رو بزن ❤️</p><button class="play" id="playBtn" type="button">▶ شنیدن پیام من ❤️</button><audio id="voice" controls preload="metadata"><source src="voice-09.m4a" type="audio/mp4">مرورگر شما پخش صدا را پشتیبانی نمی‌کند.</audio><p class="hint">اگر صدا پخش نشد، از کنترل پخش پایین استفاده کن.</p><div class="signature">پسرت ایمان <span class="heart">💘</span></div><div class="bottom">با عشق، برای بهترین مامان دنیا</div></main></div><script>const a=document.getElementById('voice'),b=document.getElementById('playBtn');b.addEventListener('click',async()=>{try{if(a.paused){await a.play();b.textContent='Ⅱ توقف پیام';}else{a.pause();b.textContent='▶ ادامه پیام ❤️';}}catch(e){b.textContent='برای پخش، دکمه ▶ را در نوار صدا بزن';}});a.addEventListener('ended',()=>b.textContent='▶ دوباره گوش بده ❤️');a.addEventListener('play',()=>b.textContent='Ⅱ توقف پیام');a.addEventListener('pause',()=>{if(!a.ended)b.textContent='▶ ادامه پیام ❤️';});</script></body></html>
